name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nit_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: nit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nit_test -d nit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nit_test:test_password@localhost:5432/nit_test
      PGSSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate Google Play listing assets
        run: npm run store-assets:validate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate container configuration
        env:
          POSTGRES_PASSWORD: ci-test-password
          APP_ORIGIN: http://localhost:8080
          APP_URL: http://localhost:8080
        run: docker compose config --quiet
      - name: Build API container
        run: docker build --target api -t vow-api:ci .
      - name: Build web container
        run: docker build --target web -t vow-web:ci .
