name: Browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "test/**"]

permissions:
  contents: write

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Generate feature graphic
        run: node scripts/generate-store-assets.mjs
      - name: Commit generated Play Store preview assets
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store-assets/google-play/app-icon-512.png store-assets/google-play/feature-graphic.png store-assets/google-play/phone/*.png
          if git diff --cached --quiet; then
            echo "Store assets are unchanged; no commit needed."
          else
            git commit -m "docs: add generated Google Play preview assets"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Upload Play Store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vow-google-play-phone-screenshots
          path: |
            store-assets/google-play/phone/*.png
            store-assets/google-play/feature-graphic.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vow-playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
