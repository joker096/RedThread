name: Generate npm lockfile

on:
  push:
    branches: [fix/paddle-sdk-lockfile]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from the pinned manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact Paddle SDK lock
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const pkg=JSON.parse(fs.readFileSync('package.json')); const lock=JSON.parse(fs.readFileSync('package-lock.json')); if (pkg.dependencies['@paddle/paddle-node-sdk'] !== '3.11.1' || lock.packages['node_modules/@paddle/paddle-node-sdk']?.version !== '3.11.1') process.exit(1);"
      - name: Commit generated lockfile to this draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): add reproducible npm lockfile"
          git push origin HEAD
