services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vow_app}
      POSTGRES_USER: ${POSTGRES_USER:-vow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: .
      target: api
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: "false"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  ad-event-retention:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: "false"
      AD_EVENT_CLEANUP_BATCH_SIZE: ${AD_EVENT_CLEANUP_BATCH_SIZE:-1000}
    command:
      - sh
      - -c
      - |
        while :; do
          node scripts/cleanup-ad-events.js || echo "Ad-event cleanup failed; retrying on the next daily cycle."
          sleep 86400
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  gift-request-expiry:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: "false"
      GIFT_EXPIRY_BATCH_SIZE: ${GIFT_EXPIRY_BATCH_SIZE:-100}
    command:
      - sh
      - -c
      - |
        while :; do
          node server/expire-gift-requests.js || echo "Gift request expiry failed; retrying on the next minute."
          sleep 60
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    restart: unless-stopped
    profiles: ["identity-l3"]
    environment:
      CLAMD_CONF_StreamMaxLength: 120M
      CLAMD_CONF_MaxFileSize: 120M
      CLAMD_CONF_MaxScanSize: 120M
      CLAMD_CONF_MaxThreads: 2
      CLAMD_CONF_MaxQueue: 4
    volumes:
      - clamav_database:/var/lib/clamav
    mem_limit: 4g
    mem_reservation: 3g
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 --host 127.0.0.1 --port 3310"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    networks: [backend]

  identity-l3-worker:
    build:
      context: .
      target: api
    restart: unless-stopped
    profiles: ["identity-l3"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: "${PGSSL:-false}"
      IDENTITY_L3_STORAGE_DIR: /app/uploads/private-identity-l3
      IDENTITY_L3_ENCRYPTION_KEY: ${IDENTITY_L3_ENCRYPTION_KEY:-}
      IDENTITY_L3_CLAMD_HOST: clamav
      IDENTITY_L3_CLAMD_PORT: "3310"
    command: ["node", "server/process-identity-l3-queue.js"]
    volumes:
      - private_identity_l3:/app/uploads/private-identity-l3:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    networks: [backend]

  identity-l3-expiry:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: "${PGSSL:-false}"
      IDENTITY_L3_EXPIRY_BATCH_SIZE: ${IDENTITY_L3_EXPIRY_BATCH_SIZE:-100}
    command:
      - sh
      - -c
      - |
        while :; do
          node server/expire-identity-l3-approvals.js || echo "L3 approval expiry failed; retrying on the next minute."
          sleep 60
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: ${PGSSL:-false}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Vow <noreply@example.com>}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_PRICE_ID_1MONTH: ${PADDLE_PRICE_ID_1MONTH:-}
      PADDLE_PRICE_ID_3MONTHS: ${PADDLE_PRICE_ID_3MONTHS:-}
      PADDLE_PRICE_ID_LIFETIME: ${PADDLE_PRICE_ID_LIFETIME:-}
      DIDIT_ENVIRONMENT: ${DIDIT_ENVIRONMENT:-sandbox}
      DIDIT_SANDBOX_KEY_CONFIRMED: ${DIDIT_SANDBOX_KEY_CONFIRMED:-false}
      DIDIT_LIVE_KEY_CONFIRMED: ${DIDIT_LIVE_KEY_CONFIRMED:-false}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
      DIDIT_APPLICATION_ID: ${DIDIT_APPLICATION_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      DIDIT_WEBHOOK_SECRET_PREVIOUS: ${DIDIT_WEBHOOK_SECRET_PREVIOUS:-}
      IDENTITY_L3_STORAGE_DIR: /app/uploads/private-identity-l3
      IDENTITY_L3_ENCRYPTION_KEY: ${IDENTITY_L3_ENCRYPTION_KEY:-}
      PHOTO_STORAGE_DIR: /app/uploads/private-photos
      PHOTO_AI_ENABLED: ${PHOTO_AI_ENABLED:-false}
      PHOTO_AI_MODEL: ${PHOTO_AI_MODEL:-llava:7b}
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-false}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen2.5:3b}
    volumes:
      - private_photos:/app/uploads/private-photos
      - private_identity_l3:/app/uploads/private-identity-l3
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [backend, frontend, egress]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

volumes:
  postgres_data:
  private_photos:
  private_identity_l3:
  clamav_database:

networks:
  backend:
    internal: true
  frontend:
    internal: true
  egress:
    driver: bridge
