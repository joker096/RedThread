services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vow_app}
      POSTGRES_USER: ${POSTGRES_USER:-vow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  migrate:
    build:
      context: .
      target: api
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: "false"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  ad-event-retention:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: "false"
      AD_EVENT_CLEANUP_BATCH_SIZE: ${AD_EVENT_CLEANUP_BATCH_SIZE:-1000}
    command:
      - sh
      - -c
      - |
        while :; do
          node scripts/cleanup-ad-events.js || echo "Ad-event cleanup failed; retrying on the next daily cycle."
          sleep 86400
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vow_app}
      PGSSL: ${PGSSL:-false}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Vow <noreply@example.com>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_1MONTH: ${STRIPE_PRICE_ID_1MONTH:-}
      STRIPE_PRICE_ID_3MONTHS: ${STRIPE_PRICE_ID_3MONTHS:-}
      STRIPE_PRICE_ID_LIFETIME: ${STRIPE_PRICE_ID_LIFETIME:-}
      PHOTO_STORAGE_DIR: /app/uploads/private-photos
      PHOTO_AI_ENABLED: ${PHOTO_AI_ENABLED:-false}
      PHOTO_AI_MODEL: ${PHOTO_AI_MODEL:-llava:7b}
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-false}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen2.5:3b}
    volumes:
      - private_photos:/app/uploads/private-photos
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [private, egress]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

volumes:
  postgres_data:
  private_photos:

networks:
  private:
    internal: true
  egress:
    driver: bridge
